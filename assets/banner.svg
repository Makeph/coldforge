<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 440" width="1280" height="440" role="img" aria-label="coldforge — honest, local-first cold outreach. CLI and MCP.">
  <rect width="1280" height="440" fill="#F5F2EC"/>

  <!-- ── masthead ─────────────────────────────────────────────────────────── -->
  <g font-family="ui-monospace, 'SF Mono', 'Cascadia Code', Consolas, monospace"
     font-size="13" letter-spacing="2.6" fill="#8A8073">
    <text x="96" y="82">HONEST · LOCAL-FIRST · NO SAAS</text>
    <text x="1184" y="82" text-anchor="end">CLI · MCP · SQLITE · MIT</text>
  </g>
  <line x1="96" y1="102" x2="1184" y2="102" stroke="#DCD5C7" stroke-width="1"/>

  <!-- ── wordmark + deck ──────────────────────────────────────────────────── -->
  <text x="92" y="230" font-family="Georgia, 'Iowan Old Style', 'Times New Roman', serif"
        font-size="118" letter-spacing="-3">
    <tspan fill="#17140F">cold</tspan><tspan fill="#A63D17">forge</tspan>
  </text>
  <g font-family="Georgia, 'Iowan Old Style', 'Times New Roman', serif">
    <text x="96" y="286" font-size="29" fill="#17140F">A precision tool, not a spam cannon.</text>
    <text x="96" y="326" font-size="21" fill="#6E655B">Low caps, real send windows, and an</text>
    <text x="96" y="354" font-size="21" fill="#6E655B">unsubscribe that actually works.</text>
  </g>

  <!-- ── spec column ──────────────────────────────────────────────────────── -->
  <line x1="784" y1="140" x2="784" y2="356" stroke="#DCD5C7" stroke-width="1"/>
  <g>
    <g font-family="ui-monospace, 'SF Mono', 'Cascadia Code', Consolas, monospace"
       font-size="12" letter-spacing="2.4" fill="#9C9285">
      <text x="836" y="162">DELIVERABILITY</text>
      <text x="836" y="234">GUARDRAILS</text>
      <text x="836" y="306">STORAGE</text>
    </g>
    <g font-family="Georgia, 'Iowan Old Style', 'Times New Roman', serif"
       font-size="21" fill="#3B3630">
      <text x="836" y="190">SPF · DKIM · DMARC, scored 0–100</text>
      <text x="836" y="262">Send window, daily cap, one bump</text>
      <text x="836" y="334">One SQLite file you can delete</text>
    </g>
  </g>

  <!-- ── colophon ─────────────────────────────────────────────────────────── -->
  <line x1="96" y1="382" x2="1184" y2="382" stroke="#DCD5C7" stroke-width="1"/>
  <g font-family="ui-monospace, 'SF Mono', 'Cascadia Code', Consolas, monospace"
     font-size="14" letter-spacing="3.4">
    <text x="96" y="414" fill="#3A4A52">RESEARCH</text>
    <text x="256" y="414" fill="#CBC3B4">/</text>
    <text x="288" y="414" fill="#4C5150">PERSONALIZE</text>
    <text x="500" y="414" fill="#CBC3B4">/</text>
    <text x="532" y="414" fill="#645646">SEQUENCE</text>
    <text x="692" y="414" fill="#CBC3B4">/</text>
    <text x="724" y="414" fill="#8A4B26">SEND</text>
    <text x="820" y="414" fill="#CBC3B4">/</text>
    <text x="852" y="414" fill="#A63D17">FOLLOW</text>
  </g>
</svg>
