<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 440" width="1280" height="440" role="img" aria-label="coldforge — honest, local-first cold outreach. CLI and MCP.">
  <rect width="1280" height="440" fill="#121110"/>

  <g font-family="ui-monospace, 'SF Mono', Consolas, monospace" font-size="15"
     letter-spacing="2.8" fill="#82786B">
    <text x="96" y="82">HONEST · LOCAL-FIRST · NO SAAS</text>
    <text x="1184" y="82" text-anchor="end">CLI · MCP · SQLITE · MIT</text>
  </g>
  <line x1="96" y1="102" x2="1184" y2="102" stroke="#332E28" stroke-width="1"/>

  <text x="92" y="230" font-family="Georgia, 'Iowan Old Style', 'Times New Roman', serif"
        font-size="118" letter-spacing="-3">
    <tspan fill="#F2EDE3">cold</tspan><tspan fill="#E2703A">forge</tspan>
  </text>

  <g font-family="Georgia, 'Iowan Old Style', 'Times New Roman', serif">
    <text x="96" y="286" font-size="29" fill="#F2EDE3">A precision tool, not a spam cannon.</text>
    <text x="96" y="326" font-size="21" fill="#9A9084">Low caps, real send windows, and an</text>
    <text x="96" y="354" font-size="21" fill="#9A9084">unsubscribe that actually works.</text>
  </g>

  <line x1="784" y1="140" x2="784" y2="356" stroke="#332E28" stroke-width="1"/>
  <g font-family="ui-monospace, 'SF Mono', Consolas, monospace" font-size="14"
     letter-spacing="2.6" fill="#7A6F62">
    <text x="836" y="162">DELIVERABILITY</text>
    <text x="836" y="234">GUARDRAILS</text>
    <text x="836" y="306">STORAGE</text>
  </g>
  <g font-family="Georgia, 'Iowan Old Style', 'Times New Roman', serif" font-size="22" fill="#E4DCCF">
    <text x="836" y="190">SPF · DKIM · DMARC, scored 0–100</text>
    <text x="836" y="262">Send window, daily cap, one bump</text>
    <text x="836" y="334">One SQLite file you can delete</text>
  </g>

  <line x1="96" y1="382" x2="1184" y2="382" stroke="#332E28" stroke-width="1"/>
  <g font-family="ui-monospace, 'SF Mono', Consolas, monospace" font-size="16" letter-spacing="3.6">
    <text x="96" y="414" fill="#6E6558">RESEARCH</text>
    <text x="256" y="414" fill="#3D372F">/</text>
    <text x="288" y="414" fill="#867967">PERSONALIZE</text>
    <text x="500" y="414" fill="#3D372F">/</text>
    <text x="532" y="414" fill="#9C8768">SEQUENCE</text>
    <text x="692" y="414" fill="#3D372F">/</text>
    <text x="724" y="414" fill="#C07A47">SEND</text>
    <text x="820" y="414" fill="#3D372F">/</text>
    <text x="852" y="414" fill="#E2703A">FOLLOW</text>
  </g>
</svg>
