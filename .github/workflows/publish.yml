name: Publish to PyPI

# Build a pure-Python wheel + sdist and publish to PyPI via Trusted Publishing
# (OIDC) on a version tag — no API token stored anywhere. Tag vX.Y.Z and push.
#
# One-time setup on PyPI: project → Publishing → add a trusted publisher for
# owner `Makeph`, repo `coldforge`, workflow `publish.yml`, environment `pypi`.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build sdist + wheel
        run: |
          python -m pip install --upgrade build twine
          python -m build
          python -m twine check dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    name: publish to PyPI
    needs: [build]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    environment: pypi
    permissions:
      id-token: write   # required for trusted publishing
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          # Re-firing a tag adds newly-built files without failing on ones PyPI has.
          skip-existing: true
